<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400"><title>安卓自适应图标背景</title><defs><filter id="felt" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="1.2" numOctaves="3" seed="3" result="n"/><feColorMatrix in="n" type="matrix" values=".33 .33 .33 0 0 .33 .33 .33 0 0 .33 .33 .33 0 0 0 0 0 0 1" result="g"/><feComponentTransfer in="g" result="g2"><feFuncR type="linear" slope=".5" intercept=".7"/><feFuncG type="linear" slope=".5" intercept=".7"/><feFuncB type="linear" slope=".5" intercept=".7"/></feComponentTransfer><feBlend in="SourceGraphic" in2="g2" mode="multiply" result="b"/><feComposite in="b" in2="SourceGraphic" operator="in"/></filter>
<filter id="psh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#2b3a20" flood-opacity=".35"/></filter>
<filter id="lsh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#3a2010" flood-opacity=".45"/></filter>
<filter id="tsh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="1.5" stdDeviation="1" flood-color="#2a1608" flood-opacity=".5"/></filter>
<radialGradient id="btn" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#6b4a3a"/><stop offset="1" stop-color="#1a0e08"/></radialGradient>
<pattern id="satin" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><rect width="5" height="5" fill="#4a2c1e"/><rect width="1.8" height="5" fill="#70473a"/></pattern>
<filter id="fuzz" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="5" result="t"/><feDisplacementMap in="SourceGraphic" in2="t" scale="11" xChannelSelector="R" yChannelSelector="G"/></filter></defs><rect width="400" height="400" fill="#6fbf82"/><rect width="400" height="400" fill="#6fbf82" filter="url(#felt)"/></svg>
