<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400"><title>安卓自适应图标前景</title><defs><filter id="felt" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="1.2" numOctaves="3" seed="3" result="n"/><feColorMatrix in="n" type="matrix" values=".33 .33 .33 0 0 .33 .33 .33 0 0 .33 .33 .33 0 0 0 0 0 0 1" result="g"/><feComponentTransfer in="g" result="g2"><feFuncR type="linear" slope=".5" intercept=".7"/><feFuncG type="linear" slope=".5" intercept=".7"/><feFuncB type="linear" slope=".5" intercept=".7"/></feComponentTransfer><feBlend in="SourceGraphic" in2="g2" mode="multiply" result="b"/><feComposite in="b" in2="SourceGraphic" operator="in"/></filter>
<filter id="psh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#2b3a20" flood-opacity=".35"/></filter>
