<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#fff7ec">
  <title>小熊写字</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="brand"><span class="bear" aria-hidden="true">🐻</span><span>小熊写字</span></div>
    <button class="icon-btn" id="settings-btn" type="button" aria-label="家长设置">⚙︎</button>
  </header>

  <main>
    <section class="ask card">
      <button class="mic" id="mic" type="button" aria-label="按住说话，松手结束">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15a3.5 3.5 0 0 0 3.5-3.5v-6a3.5 3.5 0 1 0-7 0v6A3.5 3.5 0 0 0 12 15Zm6-3.5a1 1 0 1 0-2 0 4 4 0 0 1-8 0 1 1 0 1 0-2 0 6 6 0 0 0 5 5.91V20H8.5a1 1 0 1 0 0 2h7a1 1 0 1 0 0-2H13v-2.59a6 6 0 0 0 5-5.91Z"/></svg>
      </button>
      <div class="ask-main">
        <p class="ask-hint" id="ask-hint">按住话筒说话，说完松手</p>
        <form id="search-form" class="search" autocomplete="off">
          <input id="query" name="q" type="search" enterkeyhint="search" placeholder="比如：三点水的江" aria-label="想写的字">
          <button type="submit" class="go">查</button>
        </form>
        <div class="chips" id="examples">
          <span class="chips-label">可以这样说</span>
          <button type="button" class="chip">妈妈的妈</button>
          <button type="button" class="chip">三点水的江</button>
          <button type="button" class="chip">蝴蝶</button>
          <button type="button" class="chip">第三声的 ma</button>
        </div>
        <div class="chips" id="history" hidden></div>
      </div>
    </section>

    <section id="status" class="status" hidden></section>

    <section id="result" hidden>
      <div class="word-row">
        <div class="word" id="word"></div>
        <button class="icon-btn speak" id="speak-word" type="button" aria-label="读一读">🔊</button>
      </div>
      <div class="alts" id="alts" hidden></div>

      <div class="grid">
        <div class="card pad-card">
          <div class="pad-head">
            <span class="counter" id="counter"></span>
            <label class="toggle"><input type="checkbox" id="radical-toggle" checked> 部首变色</label>
          </div>
          <div class="pad" id="pad">
            <svg class="grid-bg" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
              <rect x="0.75" y="0.75" width="98.5" height="98.5" class="frame"/>
              <line x1="50" y1="0" x2="50" y2="100"/><line x1="0" y1="50" x2="100" y2="50"/>
              <line x1="0" y1="0" x2="100" y2="100" class="diag"/><line x1="100" y1="0" x2="0" y2="100" class="diag"/>
            </svg>
            <div id="writer"></div>
            <div class="praise" id="praise" hidden></div>
          </div>
          <div class="controls">
            <button type="button" class="btn primary" id="play">▶ 写一遍</button>
            <button type="button" class="btn" id="next">下一笔</button>
            <button type="button" class="btn" id="trace">✍︎ 我来写</button>
            <button type="button" class="btn small" id="speed" aria-label="书写速度">中速</button>
          </div>
        </div>

        <div class="card info" id="info"></div>
      </div>

      <div class="card steps-card">
        <h2>笔顺 <span id="steps-total"></span></h2>
        <ol class="steps" id="steps"></ol>
      </div>
    </section>
  </main>

  <dialog id="settings">
    <form method="dialog" class="settings">
      <h2>家长设置</h2>
      <p>从服务端地址打开时会自动连接字典服务；从其他地址访问时，可以填写服务端的设备访问凭证。不连接也能看笔顺。</p>
      <input id="token" type="password" autocomplete="off" placeholder="设备访问凭证">
      <p class="muted" id="settings-note"></p>
      <div class="dialog-actions">
        <button value="cancel" class="btn">取消</button>
        <button value="save" class="btn primary" id="save-token">保存</button>
      </div>
    </form>
  </dialog>

  <script src="vendor/hanzi-writer.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
